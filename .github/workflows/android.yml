name: Build InstaFocus APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Prepare Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          SETTINGS="$(find "$ROOT" \
            -type f \
            -name settings.gradle.kts \
            -not -path '*/.git/*' \
            -print -quit || true)"

          if [ -z "$SETTINGS" ]; then
            ZIP_FILE="$(find "$ROOT" \
              -maxdepth 2 \
              -type f \
              -iname 'InstaFocus*.zip' \
              -not -path '*/.git/*' \
              -print -quit || true)"

            if [ -n "$ZIP_FILE" ]; then
              EXTRACT_DIR="$RUNNER_TEMP/instafocus-source"

              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"

              echo "Extracting project ZIP:"
              echo "$ZIP_FILE"

              unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

              SETTINGS="$(find "$EXTRACT_DIR" \
                -type f \
                -name settings.gradle.kts \
                -print -quit || true)"
            fi
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Could not find settings.gradle.kts."
            echo "Repository contents:"
            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -not -path '*/.git/*' \
              | sort \
              | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaFocus-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
